
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ishaq l'artiste — textes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Source+Serif+4:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #E4E1D3;
    --paper-raised: #DAD6C4;
    --ink: #1C1B18;
    --ink-soft: #55523F;
    --rule: #C7C1AA;
    --stamp: #8C2F26;
    --font-meta: 'Special Elite', 'Courier New', monospace;
    --font-body: 'Source Serif 4', Georgia, serif;
  }

  *{ box-sizing: border-box; }

  html{ background: var(--paper); }

  body{
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  a{ color: inherit; }

  a:focus-visible, button:focus-visible{
    outline: 2px solid var(--stamp);
    outline-offset: 3px;
  }

  .wrap{
    max-width: 680px;
    margin: 0 auto;
    padding: 3.5rem 1.5rem 6rem;
  }

  /* ---------- header ---------- */
  header.site{
    margin-bottom: 3rem;
  }

  .author-photo{
    display: block;
    width: 88px;
    height: 88px;
    border-radius: 50%;
    object-fit: cover;
    object-position: 50% 15%;
    margin: 0 0 1.1rem;
    filter: sepia(12%) contrast(1.02);
    border: 1px solid var(--rule);
    box-shadow: 0 0 0 4px var(--paper), 0 0 0 5px var(--rule);
  }

  .wordmark{
    font-family: var(--font-meta);
    font-size: 1.15rem;
    letter-spacing: 0.02em;
    text-decoration: none;
    color: var(--ink);
  }

  .tagline{
    margin: 0.6rem 0 0;
    color: var(--ink-soft);
    font-size: 0.98rem;
    font-style: italic;
    max-width: 32ch;
  }

  hr.rule{
    border: none;
    border-top: 1px solid var(--rule);
    margin: 2.2rem 0;
  }

  /* ---------- stamp badge ---------- */
  .stamp{
    display: inline-block;
    font-family: var(--font-meta);
    font-size: 0.68rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--stamp);
    border: 1.5px solid var(--stamp);
    padding: 0.18rem 0.55rem;
    transform: rotate(-2deg);
    line-height: 1;
  }

  /* ---------- home: list of works ---------- */
  .entry{
    padding: 1.8rem 0;
    border-top: 1px solid var(--rule);
  }
  .entry:first-of-type{ border-top: none; }

  .entry-title{
    display: block;
    font-family: var(--font-body);
    font-size: 1.5rem;
    font-weight: 600;
    margin: 0.7rem 0 0.4rem;
    text-decoration: none;
    color: var(--ink);
    line-height: 1.25;
  }
  .entry-title:hover{ color: var(--stamp); }

  .entry-meta{
    font-family: var(--font-meta);
    font-size: 0.72rem;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
    margin: 0 0 0.7rem;
  }

  .entry-excerpt{
    margin: 0;
    color: var(--ink-soft);
    font-size: 0.98rem;
    line-height: 1.6;
  }

  .empty-note{
    color: var(--ink-soft);
    font-style: italic;
    font-size: 0.95rem;
  }

  /* ---------- reading view ---------- */
  .back-link{
    display: inline-block;
    font-family: var(--font-meta);
    font-size: 0.78rem;
    letter-spacing: 0.03em;
    text-decoration: none;
    color: var(--ink-soft);
    margin-bottom: 2rem;
  }
  .back-link:hover{ color: var(--stamp); }

  .work-title{
    font-size: 2rem;
    line-height: 1.2;
    margin: 0.8rem 0 1.6rem;
  }

  .tabs{
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem 1.1rem;
    padding: 0 0 1.2rem;
    margin-bottom: 2.2rem;
    border-bottom: 1px solid var(--rule);
    font-family: var(--font-meta);
  }

  .tab{
    background: none;
    border: none;
    padding: 0.2rem 0;
    font-family: var(--font-meta);
    font-size: 0.76rem;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .tab.active{
    color: var(--ink);
    border-bottom-color: var(--stamp);
  }
  .tab:hover{ color: var(--ink); }

  .chapter-title{
    font-style: italic;
    font-weight: 600;
    font-size: 1.05rem;
    color: var(--ink-soft);
    margin: 0 0 2rem;
  }

  .chapter-body{
    font-size: 1.08rem;
    line-height: 1.75;
    animation: settle 0.35s ease-out;
  }

  @keyframes settle{
    from{ opacity: 0; transform: translateY(4px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  .chapter-body p{
    margin: 0 0 1.15rem;
  }

  .section-heading{
    font-style: italic;
    font-weight: 600;
    font-size: 1.08em;
    color: var(--ink);
    margin: 2.4rem 0 1rem;
  }

  .refrain{
    text-align: center;
    font-style: italic;
    color: var(--stamp);
    font-size: 1.12em;
    margin: 2.2rem 0;
  }

  .dialogue{
    font-family: var(--font-meta);
    font-size: 0.88em;
    line-height: 1.55;
    color: var(--ink-soft);
    border-left: 2px solid var(--rule);
    padding-left: 1.1rem;
    margin: 1.5rem 0;
  }
  .dialogue p{ margin: 0.3rem 0; }

  .epigraph{
    font-style: italic;
    color: var(--ink-soft);
    margin: 0 0 1.6rem;
  }

  .poem{
    font-style: italic;
    line-height: 1.65;
    margin: 0 0 1.6rem;
  }

  .speech{
    font-style: italic;
    border-left: 2px solid var(--stamp);
    padding-left: 1.2rem;
    margin: 1.6rem 0;
    color: var(--ink);
  }

  .a-suivre{
    font-family: var(--font-meta);
    font-size: 0.7rem;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    text-align: right;
    margin: -0.4rem 0 2.4rem;
  }

  .tag-line{
    font-family: var(--font-meta);
    font-size: 0.7rem;
    color: var(--ink-soft);
    margin: -1rem 0 1.6rem;
  }

  .chapter-nav{
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
    font-family: var(--font-meta);
    font-size: 0.78rem;
  }
  .chapter-nav a{
    text-decoration: none;
    color: var(--ink-soft);
  }
  .chapter-nav a:hover{ color: var(--stamp); }
  .chapter-nav .spacer{ flex: 1; }

  @media (max-width: 560px){
    .wrap{ padding: 2.2rem 1.15rem 4rem; }
    .work-title{ font-size: 1.6rem; }
    .entry-title{ font-size: 1.28rem; }
    .chapter-body{ font-size: 1.02rem; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>

<script>
/* =========================================================
   Pour ajouter un nouveau texte : ajoute un objet à ce
   tableau `works`. Chaque texte a un id unique (utilisé
   dans l'URL), un genre, un titre, un extrait, et une liste
   de chapitres (un seul chapitre si le texte est court,
   comme un poème ou un essai).
   ========================================================= */
const works = [
  {
    id: 'conversations-entre-moustiques',
    genre: 'Humour',
    title: "Conversations entre moustiques",
    chapterLabel: 'Piqûre',
    excerpt: "Le premier moustique se disait anémié. Manque de fer et faiblesse générale. « Putain j'ai la flemme » qu'il disait.",
    chapters: [
      {
        title: "Piqûre 1",
        html: `
          <p>Le premier moustique se disait anémié. Manque de fer et faiblesse générale. « Putain j'ai la flemme » qu'il disait. « Tous ces cambodgiens ne bouffent rien. Et nous on se retrouve à crever la dalle aussi. ».</p>
          <p>Son compère moustique poursuit : « Je me suis foulé la trompe hier nuit. J'ai piqué la joue et je suis tombé sur l'os. Ils sont si maigres que ça en devient affligeant. Je vais quitter ce bled si ça continue. »</p>
          <p>Les deux étaient posés sur l'orteil crasseux d'un nouveau-né. L'aube pointait déjà mais il faisait toujours très chaud sous la bâche bleue. Une flaque d'eau boueuse était à proximité et une belle femelle anophèle y faisait sa toilette.</p>
          <div class="dialogue">
            <p>—C'est pas ta meuf ça ? relance le premier moustique.</p>
            <p>—Laisse tomber elle m'a plaqué pour un zigoto qui vit dans la cuisine. Un hipster de merde qui lui a fait gouter de l'expat. Elle a trouvé le repas fruité et rafraichissant. Une connasse.</p>
            <p>—Oh ... mais du calme ! C'est une apouchou canon que tu dénigres comme ça ?</p>
            <p>—Apouchou mon cul. Une vulgaire go matérialiste oui ! Quand on se régalait sur des bras de tuberculeux elle ne se plaignait pas. Il a suffi que l'arriviste des cuisines lui déniche un coopérant de la croix rouge et elle commence à se prendre.</p>
            <p>—Des meufs c'est pas ce qui manque ici. Fais un tour du côté de la douche, près des rigoles. Il y a un coin là-bas dans des pneus, c'est rempli de kpoclés soyeuses. Elles ne demandent rien, juste que tu leur trouves des cuisses pas trop maigres pour diner et elles restent avec toi toute la nuit. Il y a même un VIP sur un pan de moustiquaire abandonné. Une belle brise régulière pour vous caresser les ailes, je te jure c'est trop cool.</p>
            <p>—Je n'ai plus le moral pour ces conneries. Je vais prendre un visa pour Gaza. Il parait qu'il y a des tas de camps là-bas.</p>
            <p>—En Palestine ?!? T'es un fou toi. Moi je pense plutôt à Ganvié. De l'eau, des herbes, du soleil, des moustiquaires trouées, le paradis !</p>
            <p>—C'est vrai que c'est pas mal ouais. Fuck la saison sèche. Toujours de l'eau pour ta meuf et les petits. Parfois même on dégote du touriste imprudent. La belle vie !</p>
            <p>—Bon ... c'est pas tout mais il va falloir se planquer. Il va faire jour. Tu fais quoi demain ?</p>
            <p>—J'ai un rencard avec une nouvelle. Elle vient de Lagos. Elle a voyagé en bus la veinarde. Je vais l'inviter à bouffer chinois. J'ai entendu parler d'un chantier pas très loin où on trouve du chinois sous coke. Ça va déchirer ! Je te raconterai.</p>
          </div>
        `
      },
      {
        title: "Piqûre 2",
        html: `
          <p>C'est la fin de nuit. Les uns et les autres sont repus. Quelques-uns ont fini aplatis contre des murs crasseux, d'autres ont explosé sous des claques réflexes de dormeurs irrités. Il y en a même qui ont redécoré les draps dans des demeures minables, où les taches de sang composent des toiles de maîtres. Du Picasso fiévreux, du Pollock artériel. La misère a du génie, pourvu qu'elle saigne.</p>
          <p>Pour tous ces moustiques, manger, c'est aller à la chasse. Traquer de l'humain, être rusé, respecter le timing, choisir le menu qui vous convient. Le mollet du maçon ne se déguste pas comme la cheville du professeur. Tout est affaire de nez, de patience et de vice. À l'angle d'une pièce exiguë et encombrée, quelques survivants racontaient leurs expériences de la nuit quand une plainte retentit :</p>
          <div class="dialogue">
            <p>—Putain notre vie est si duuuuuuuuuuure. Merde. Les Chinois ont asphyxié ma go avec une saloperie d'insecticide. Elle est dans le coma la pauvre. Tout allait bien pourtant. La clim, la bouffe chinoise, le calme et tout. On s'était réfugiés dans l'armoire pour faire une pause avant d'attaquer les mollets. On somnolait au calme sur un cintre. La fourberie des Chinois, ce n'est pas une légende les gars. Ils ne se battent pas à la loyale. Ils te gazent comme on éteint une bougie : sans haine, mais avec méthode.</p>
            <p>—Parle pour toi ! Moi ma famille vient du Niger et si je te raconte tu ne me croiras pas. Ici tu as des ampoules, des orteils en libre-service, des veines apparentes. Là-bas, c'est du catering de survie. Si t'as un mollet, tu dis merci. Ici c'est pas la belle vie, c'est le paradis climatisé, enfoiré.</p>
            <p>—Toi, laisse tomber tes histoires de Niger, ma go ne respire plus. Elle est par terre dans le placard. On doit la sauver.</p>
            <p>—Qui ça ON ?</p>
            <p>—Mais tu es un vrai égoïste toi. Tu n'as pas de cœur ? Ta maman ne t'a pas assez aimé quand tu étais petit ? Elle t'a pondu dans une flaque, et t'as jamais réussi à en sortir.</p>
          </div>
          <p>Son compère de la veille arrive, un peu épuisé, la démarche molle, une aile froissée par la déception. Il écoute, puis balance, presque avec tendresse :</p>
          <div class="dialogue">
            <p>—Mon frère, tu tombes bien, il y a urgence, une fille à sauver. Une princesse, une diva. C'est la meuf de Lagos dont je t'ai parlé hier. Bien nourrie, en forme, avec un teint propre. Je l'ai amenée bouffer chinois comme je t'ai dit. Oreille, joue, cuisse, un menu complet. Tout allait nickel et subitement, bombardement à l'arme chimique. Sans prévenir. Ces Asiatiques sont des monstres. Ils te sourient, ils te servent le sang, et puis ils te pulvérisent. C'est de la gastronomie de guerre.</p>
            <p>—Ah bon ! Yako, mon frère. Il va falloir te trouver une autre meuf.</p>
            <p>—Quoi ? Mais qu'est-ce qui vous arrive à tous ce matin ? C'est l'amour de ma vie, putain ! Je voulais fonder un foyer avec elle et me caser, bordel.</p>
            <p>—Eeeeh... mec ! Calme-toi. C'est notre destin de moustiques. Chaque nuit c'est l'hécatombe et on ne s'est jamais plaint. Apparemment toi tu as besoin de prier plus souvent. Tu oublies l'essence même de notre condition de moustiques. Tu as lu « Les 9 chemins de la destinée » ? C'est une prophétie qui...</p>
            <p>—Fais chieeeeeeeeerrrrrrr ! Je te parle de ma go, mec. Qu'est-ce que tu me soules avec des histoires de prophète. Allons la récupérer dans le placard, je suis sûr qu'on peut la réanimer.</p>
            <p>—Tu vas devoir faire preuve de bravoure et y retourner seul mon gars. En plus, les containers, même climatisés, c'est pas trop mon truc. Moi j'ai perdu deux partenaires pendant la nuit et je m'en suis remis. J'ai même failli rester coincé dans les mailles d'une moustiquaire en plein cœur d'un ghetto. Tu t'imagines ! Même eux ils dorment sous moustiquaire, les bâtards ! C'est plus un quartier, c'est un piège à cons avec filet.</p>
            <p>—Je vois. En fait vous êtes tous des merdes sans cœur. Entre le Nigérien qui me raconte sa vie de galérien et toi qui me parles de prière, il n'y a pas d'espoir pour moi. Écoute, toi et moi on ne se connaît plus. Oublie-moi.</p>
            <p>—Ouais c'est ça, vas-y, casse-toi. Je ne voulais même pas te parler des athlètes jamaïcains qui ont débarqué. On va varier notre régime alimentaire seuls. On n'a pas besoin de toi. En plus ils fument de la bonne, donc on va se mettre bien sans toi.</p>
            <p>—T'es qu'un connard, un aigri congénital. J'ai toujours su que tu n'étais qu'un faux frère. Et puis... je ne vais nulle part. Rien que pour te faire chier je vais bouffer jamaïcain aussi. Pauvre con. N'empêche, elle était bonne la go de Lagos. Quand je pense que je vais devoir faire une publication RIP avec sa photo, ça me fend le cœur. On publiera sa photo sur une feuille morte. Les moustiques pleurent en noir et blanc, c'est plus digne.</p>
            <p>—T'inquiète, ça va aller. On lui fera un hommage discret. Pas de discours. Juste une minute de silence, et puis on replongera dans le gras des vivants.</p>
          </div>
        `
      },
      {
        title: "Piqûre 3",
        html: `
          <p>Pas tout à fait remis de ses déboires de la veille, notre moustique déprime la trompe en berne. Juché sur le rebord d'une poubelle, il a une mine des mauvais jours. Des restes de sachets de Tombo lui servent de cave à vin. Il a perdu l'appétit, même devant des orteils velus de Libanais, et se contente de somnoler en titubant. On dirait un poète maudit, mais en plus petit, et avec des ailes.</p>
          <p>Son gars sûr débarque, le vol assuré, la réplique facile :</p>
          <div class="dialogue">
            <p>—Alors, enfoiré, on dit quoi ?</p>
            <p>—Mon frère, les Chinois ce n'est plus trop ma came. Tout est frelaté chez eux. Leur sang goûte le plastique. Même leurs moustiques ont les ailes en polyester. D'ailleurs c'est mieux de consommer local. Au pire je vais me contenter des Libanais. Une ou deux fois par semaine je me planque dans la boutique climatisée. J'attends qu'ils fassent une petite sieste et je leur prends deux grammes de sang bien riche. Tu me connais, je ne suis pas trop gourmand. Je suis un esthète. Je prélève comme on respire : discrètement, mais avec volupté.</p>
            <p>—Toi tu as toujours eu des goûts de luxe. Moi je reste sur le régime de base, de l'humanoïde négroïde subsaharien. De préférence en zones marécageuses. De temps en temps je me fais du Peul, mais uniquement en saison sèche. C'est plus ferme, plus sauvage. Ça a le goût de la transhumance.</p>
            <p>—Mais avec le changement climatique on ne sait plus qui est qui. Le climat est devenu fou. Avant, l'odeur suffisait. Maintenant, il faut un passeport gustatif. L'autre jour je guettais un nourrisson dans une chambre de bonne, tu sais, vers l'aéroport chez les clair clair là. Eh ben je suis tombé sur un Allemand bien gras, il puait le déodorant. Tu aurais fait quoi ? J'ai laissé tomber la domestique togolaise pour déguster de l'exotique. J'ai honte, mais c'était délicieux. Le remords, ça creuse.</p>
            <p>—Toi et tes plans bizarres on ne...</p>
            <p>—Putain mais c'est qui celle-là ?</p>
            <p>—Qui ça ?</p>
            <p>—Mate, la métisse fraîche là-bas !</p>
            <p>—Oh... mon gars, reste concentré. C'est une go transgénique. Elle vient de Louisiane.</p>
            <p>—C'est au Sénégal ?</p>
            <p>—Elle vient des States, connard. Elle a voyagé en cargo. Aucun insecticide ne lui fait plus rien. Une accro de chirurgie esthétique, elle va te ruiner. Elle pique en silence, comme une infirmière de luxe. Ça me fout la trouille.</p>
            <p>—Mec, on ne vit qu'une fois.</p>
            <p>—Arrête un peu mon frère. Reste con-cen-tré ! Celle-là ne bouffe pas du maçon sur chantier hein, ni de l'agriculteur immunisé en plein champ ou dans une case sommaire. Tu n'as pas les reins solides pour gérer ça, calme-toi ! Elle est hors catégorie. C'est une Formule 1. Toi, t'es une mobylette. Tu vas te faire lâcher au premier virage.</p>
            <p>—Mon frère regarde ma vie. Les Chinois ont gazé ma fiancée, ma famille a été décimée par des recrues dans les dortoirs au camp. Je n'en ai plus rien à foutre. Et puis je suis sûr qu'elle est venue avec du bétail, des humains, des Américains. Hamburgers, hot-dogs, donuts, ils doivent avoir un sang bien épicé. Mon frère... je t'aime bien mais... je crois que je vais la suivre. Je vais où elle va. Et si elle meurt, je m'écrase contre une moustiquaire neuve. Ce sera mon linceul.</p>
            <p>—Ils sont tous venus pour les championnats d'athlétisme. Les Américains, les Jamaïcains, les Russes et tout ça.</p>
            <p>—Des Russes ?</p>
            <p>—Oui... des Russes. Quoi ?</p>
            <p>—Cite-moi un seul repas russe. Aucun d'entre nous n'a jamais bouffé russe. Ça ne te tente pas ?</p>
            <p>—Moi, le sang local à base de pâte de maïs, de haricots à l'huile rouge, de riz, de manioc, de légumes et de fruits, ça me convient déjà. C'est une question de terroir. Le sang, c'est comme le vin : il faut savoir d'où il vient, et ce que la vigne a pleuré.</p>
            <p>—Mec... sois un peu ambitieux quand même. Ce sont des gars comme toi qui ratent les formations en ligne sur le e-commerce, le trading, les NFT et les bitcoins. Il faut prendre des risques man !</p>
            <p>—Mec... tu as visité combien de sachets de Tombo aujourd'hui ? Tu commences à délirer grave. Tu parles comme un coach en développement personnel qui aurait pondu ses œufs dans un bidon d'essence. Moi je vais faire une sieste et dès qu'il fera nuit noire, direction les jardins du Novotel. Il va y avoir de l'athlète au menu. Et s'il y a des Russes, je t'en ramènerai une gorgée. Pour la science.</p>
          </div>
        `
      },
      {
        title: "Piqûre 4",
        html: `
          <p>Partout où se posaient les yeux globuleux de nos amis moustiques, il n'y avait que des bras musclés, des pectoraux saillants, des mollets dodus, des sourires extrawhite et un nuage de testostérone. On aurait dit une convention de héros, un musée de la chair humaine, une exposition universelle de l'effort et de la vanité. La soirée promettait d'être fructueuse avec ce rassemblement d'athlètes de tous les coins du globe. Un buffet planétaire, dressé par la sueur et l'ambition.</p>
          <p>Des coiffures colorées et des coupes insolites à foison. Sans parler des piercings et des tatouages. Nos deux moustiques inséparables étaient aussi de la partie, planqués derrière les ramures d'un palmier nain. Leurs yeux brillaient comme des feux de détresse.</p>
          <div class="dialogue">

          <p>Le doyen était mourant. Pas d'une claque, non. Pas d'une moustiquaire imprégnée ni d'une bombe chimique. Il mourait de vieillesse, ce qui, chez les moustiques, est une forme de provocation. Avoir vécu plus de trente jours, c'est déjà tutoyer l'éternité. Lui, on lui prêtait quarante-deux nuits, deux guerres de flaques, trois exodes et une piqûre légendaire sur la nuque d'un préfet en plein discours d'inauguration.</p>

          <p>Il y avait de quoi resté pétrifié devant cette réponse glaciale. Son cœur, depuis longtemps devenu une pierre tombale, ne s'émouvait pas outre mesure. Mais dans son esprit, un disque rayé répétait en boucle : L'ordre vient d'en haut ! L'ordre vient d'en haut ! L'ordre vient d'en haut ! ...</p>
          <p>Cette formule est une réponse paramétrée. Une disquette standard mais implacable que servent souvent des intermédiaires aux regards fuyants. Pour le moment notre homme reste immobile, comme une statue à la Jésus.</p>
          <p>L'air était lourd et suffocant. Son casque lourd pesait une tonne sur son crâne aux cheveux grisonnants. Il faisait chaud comme dans les entrailles d'une vierge et son sang battait la chamade dans ses tempes comme des tamtams de guerre. Des filets de sueur glacée lézardaient son front plissé. Ses mâchoires étaient verrouillées, comme un piège qui enserre un fauve.</p>
          <p class="refrain">L'ordre vient d'en haut !</p>
          <p>En d'autres termes, la mission du jour est annulée. Des carotides tranchées, des intestins éparpillés, des crânes éclatés, quelques frayeurs et des dizaines de kilomètres dans les jambes, trois jours sans sommeil et au moment de cracher le venin, il faut se satisfaire d'un coït interrompu. Pour un étalon de compétition comme lui, ce n'était pas un exercice des plus aisés.</p>
          <p>Machinalement il fit le tour des lieux, sans détourner son regard des lunettes noires du colonel. La pièce était austère. Des murs de briques sans finition, une table et une chaise. C'est tout. Comme plafond, un ciel de tôles grises. Un décor spartiate pour ordonner aux uns et obéir aux autres. Une vulgaire cellule pour des bagnards engagés volontaires.</p>
          <p>C'était pourtant le meilleur spot du périmètre. Autour, que des tentes et des baraquements en bois. Des tranchées, des barbelés et des sacs de sable empilés. On n'aime pas trop venir sur la base 403. Peu importe où sur le globe, on fait difficilement plus rustique, austère et dépouillé. Les humanitudes s'y croisent sans s'attarder. Des blessés y agonisent. On y bouffe du plomb et de la poudre.</p>
          <p class="section-heading">Le tôlier et son garde du corps</p>
          <p>Ici le tôlier c'est le colonel aux lunettes noires. Il ne les retire presque jamais. On l'a déjà vu les arborer en pleine nuit et même quand il dort, affalé sur son lit de camp. Un luxe ici. Le colonel dort invariablement dans la même posture, jambe gauche repliée, jambe droite étendue et les bras croisés. Son béret comme appui tête et la radio près de l'oreille droite.</p>
          <p>Un caporal-chef veille sur lui adossé à un tas de sable, enchainant cigarette sur cigarette. La cavité buccale rougie par une addiction à la noix de cola, il affichait toujours des yeux injectés de sang. Tireur d'élite, ancien combattant réputé, ce vétéran avait le calme électrique de ceux qui ont du vécu. Il était surnommé POINT. Parlant peu, et même presque pas, il signait ses rares phrases d'un « Point » devenu légendaire.</p>
          <p>« Tu as ramené un prisonnier qui ne passera pas la nuit. Tu t'es juste infligé d'avoir à creuser un trou. Va le finir derrière là-bas et enterre-le. Point ! ». En général il n'y avait plus grand-chose à dire après son Point final. « Pour le déploiement de ce soir il va falloir faire avec les 300 munitions disponibles. Le convoi de ravitaillement a été attaqué. Voilà le topo. Point ! »</p>
          <p class="section-heading">La base 403</p>
          <p>Cela se passe quelque part en Afrique. Et dans le périmètre il n'y avait que de la dureté et de la féodalité. Tous les échanges étaient abrasifs comme pour mieux se conditionner à affronter des périls quotidiens. Pas de téléphone, pas de feu ou de fumée, aucune lumière la nuit. La base 403, c'est déjà le front. L'espérance de vie n'y était pas très généreuse. On s'y croise mais on ne s'y attarde pas.</p>
          <p class="section-heading">Face au colonel</p>
          <p>L'homme était toujours au garde-à-vous exactement au centre de la pièce, face au colonel. Il revient d'un assaut frontal et quelques marques sur son gilet murmuraient qu'il avait pris des balles dans la plaque d'acier. Du sang séché sous ses ongles et l'odeur âcre qu'il dégageait authentifiaient bien qu'il n'avait connu aucun confort depuis un moment. C'était ça son monde. À la frontière de la vie, en plein cœur d'un réel poignant.</p>
          <p>Toujours immobile comme un bloc de granit, il conversait avec ses démons intérieurs. Et il faut dire que ces démons-là avaient eu du boulot depuis que son équipe avait été larguée en bordure du fleuve quelques jours plus tôt. Aucun recours, aucune assistance. Il a fallu enchainer raids et embuscades sans souffler. Un blessé au compteur, qui continuait cependant à remplir son rôle, c'est le bilan pour le moment dans ses rangs.</p>
          <p class="section-heading">Soldat par atavisme</p>
          <p>Ce personnage était une véritable figure des unités opérationnelles. Ses hommes lui vouaient un respect solide et une fidélité hors norme. Il était la preuve vivante qu'il existe des individus qui personnifient une certaine idée du devoir, qui incarnent une certaine notion de sacrifice.</p>
          <p>Il est devenu soldat par atavisme. C'est un héritier d'une bravoure muette qui ne se flatte d'aucun accomplissement. Il exécute de l'humain comme on dit bonjour. Sans sentiment et sans affect. Il se met en jeu pour défendre et protéger, sans chercher à savoir qui, ni pourquoi. Il a résumé tous ses questionnements en une aptitude à faire et à être, sans se poser de questions et sans en poser non plus.</p>
          <p>Il délivre la mort avec élégance, toujours prêt à la recevoir. Sans haine et sans rancune. Un détachement intérieur qui le rendait redoutable. On ne lui connait pas d'amis ni de famille. Il était une arme fiable. Il n'est pas de ceux qu'on connait et qu'on voit. Il est de ceux qui font les choses dont on entend parfois parler sur BBC ou France 24. Au quotidien, il coupe des lignes de vie avec une humilité décomplexée.</p>
        `

        label: "Chapitre 2",
        title: "Chapitre 2 — L'ordre vient d'en haut !",
        html: `
          <p>L'écrasement prévu du repère des fous de dieux n'est plus d'actualité, en tout cas pas pour tout de suite. Il lui fallait donc dissiper la cohorte d'animosités qu'il avait recruter en lui pour concasser du djihadiste. Au chronomètre, il était entré dans cette pièce depuis environ deux minutes. Mais ses conversations intérieures duraient depuis bientôt vingt minutes.</p>
          <p>Le colonel connaissait bien la bête et restait placide. Rasé de près et le béret impeccablement vissé sur la tête, il n'attendait rien de cet homme. Pas un mot en particulier, pas une réaction spécifique, pas un épanchement de sentiments ou d'opinions. Il avait transmis le message. L'opération n'est pas pour cette nuit. Tout est dit.</p>
          <p class="refrain">L'ordre vient d'en haut !</p>
          <p>Cette nuit ne connaitra pas le déchainement de foudre auquel s'est préparé notre homme. Toujours au garde à vous, le visage grave et parfaitement illisible, il finit par saluer d'un geste mécanique et sort. Il était déjà dehors mais son aura était toujours présente dans la pièce, lourde comme du plomb.</p>
          <p class="section-heading">Le peloton</p>
          <p>Ses hommes étaient regroupés sous un arbre rongé par les termites. Il s'avance vers eux en retirant son casque et on aperçoit alors une fine cicatrice sur sa joue droite. Un adjudant lui tend une cigarette qu'il coince entre ses dents jaunies par le café. Il la lui allume et prend des nouvelles dans son regard.</p>
          <p>L'adjudant le suivait depuis quelques années. Ils ont connu bien des théâtres de guerre. Ensemble ils ont trucidé de l'humain et survécu à des situations sans issues. Ils avaient donc un lien profond et un langage du regard quasi télépathique. Ils sont frères d'armes et de sang versé. Le reste de la troupe était allongé à même le sol. Ils ont développé une capacité à s'endormir en deux minutes pour rattraper des heures de veille et de tension nerveuse extrême.</p>
          <p>« Ce n'est pas pour ce soir » lança-t-il en soufflant une longue trainée de fumée. « L'ordre vient d'en haut ! qu'ils disent. ». L'adjudant accueille la nouvelle sans aucune émotion. Quel que soit le jour qui sera retenu, ce sera toujours un beau jour pour tuer ou mourir. Il n'est plus à ça près.</p>
          <p class="section-heading">Une sieste</p>
          <p>Comme ses hommes, le commandant A1C7B23 s'allonge au sol, à l'ombre de l'arbre à karité. Seul l'adjudant reste debout le regard perdu derrière l'horizon. Il était un peu plus de 13 heures et il faisait une chaleur à cuire un œuf sur une pierre. Mais ce groupe de 13 était dans son élément, la dureté.</p>
          <p>Il n'a pas fallu plus de deux minutes au commandant aussi pour s'endormir. Le bras gauche posé sur les yeux pour cacher la lumière du soleil, la main droite sur son glock 9mm harnaché à la cuisse. Il se paye même le luxe de rêver. Plus qu'un rêve, c'était plutôt un enchevêtrement de souvenirs d'action.</p>
          <p class="section-heading">Un rêve animé</p>
          <p>Il était sur une piste de terre rouge. Toujours en tête, son AK47 modifié entre les mains, il avançait à un rythme soutenu. Derrière, les deux colonnes suivaient machinalement comme un organisme en pleine santé. Tous ses sens en éveil, il lisait le vent et les sous-entendus du paysage. Un claquement soudain se fit entendre. Une balle venait de s'écraser sur son gilet. Il recule à peine et tout le peloton riposte dans un déluge de feu.</p>
          <p>Il en fallait peu pour réhydrater son orgueil. Ceux d'en face se croyaient-ils plus mortels que lui ? Les deux colonnes se répartissent automatiquement des deux côtés de la piste et il part à droite. « Mouvement à 11 heures » gueule un homme. La pluie de balles se réorienta systématiquement et à 100 mètres environ, ceux d'en face servaient aussi de copieuses rations de plomb.</p>
          <p>Les rafales se faisaient plus courtes et on entendait plutôt du coup par coup. Le groupe fonçait vers sa cible selon une chorégraphie mille et une fois répétée. Les uns fixent l'ennemi avec des doublettes précises et de courtes rafales de minimi, pendant que d'autres avancent deux par deux. De quelques mètres à chaque fois, parfois juste de deux pas, pour se poster derrière un arbre ou un talus.</p>
          <p>Les hommes n'étaient plus qu'à 50 mètres de l'ennemi et ils pouvaient voir la RPK d'en face et les soldats postés autour qui manœuvraient en gueulant. Déjà trois hommes à terre et une grenade qui atterrit au milieu de leur équipe feu. C'est la débandade prévue.</p>
          <p>Le rêve n'était pas linéaire, et des flashs survenaient, interrompant le cours des images et des scènes qui défilent. Il avait une tête dans la main.</p>
          <div class="dialogue">
            <p>— Reportez le tir à droite bordel, reportez le tir à droite !</p>
            <p>— La radio ne passe pas.</p>
            <p>— Est-ce que l'appui feu suit un peu la danse ?</p>
            <p>— Négatif, ils sont sur un fuyard de l'autre côté.</p>
            <p>— Ecoute ... on y va. Couvre-moi.</p>
          </div>
          <p>Puis plus rien. Les interférences subliminales se sont interrompues subitement. Le commandant ronflait, toujours immobile, la main droite sur son arme de poing. L'adjudant était assis sur son sac à dos, il lisait Wolé Soyinka, un mégot de Dunhill à l'agonie entre le majeur et l'index droits. L'air était chaud, il transpirait raisonnablement, accoutumé au fait.</p>
          <p class="section-heading">Deux mètres minimum</p>
          <p>Jeune engagé volontaire, encore à l'école d'officiers, le futur commandant avait participé à ce qu'ils appellent dans leur jargon une mission radicale. Le genre d'opération dont on n'entend pas parler. Il a appris ce jour-là que pour enterrer un corps, et être à peu près sûr qu'il ne ressurgira plus, il faut creuser deux mètres minimum.</p>
          <p>Il était dans le trou, manipulant la pelle avec ardeur. La terre était rebelle à cet endroit. Ses paumes, pourtant déjà calleuses, s'en souviennent. Chaque centimètre en profondeur se méritait. Le corps, celui d'une espionne infiltrée, gisait à deux pas de lui, la nuque brisée et des taches de sang sur son abdomen perforé. Son torse à lui émergeait du trou et il pensait que ce serait suffisant.</p>
          <p>Quand il remonte pour tirer la dépouille par les jambes, son chef lui lance :</p>
          <div class="dialogue">
            <p>— Qu'est-ce que tu fous bordel ! Tu crois que c'est ok là ? On t'a rien appris dans ton école de merde ? Pour faire disparaitre un corps, c'est deux mètres minimum. Les cibles comme celles-là ça se découpe et se dissout en principe. Au minimum on brule. Mais quand y'a pas de matos, on creuse. Deux mètres minimum !</p>
          </div>
          <p>Le jeune homme qu'il était venait d'apprendre quelque chose. Il va falloir engager de la chair. Sans rechigner il redescend dans le trou et recommence à jouer de la pelle. Le sol était si dur que ses paumes étaient en sang et ses bras tétanisés. Mais bientôt, coup après coup, pelletée après pelletée, sa tête avait disparu et il était tout entier debout dans ce trou de terre rouge.</p>
          <p>Aujourd'hui le voilà commandant et leader d'un commando en plein cœur d'un territoire connu sous le nom d'AES.</p>
        `

          <p>Le réveil fut brutal, comme toujours. Pas de sursaut, pas de cri. Juste les yeux qui s'ouvrent d'un coup, déjà lucides, déjà aux aguets. Aucune transition entre le sommeil et la guerre. Chez lui, les deux mondes ne faisaient qu'un.</p>
          <p>Le soleil avait tourné. L'ombre de l'arbre à karité s'était allongée, doigts noirs griffant la terre ocre. 16h47. Trois heures de sommeil. Un festin. Ses muscles noués le saluèrent comme une vieille connaissance, une douleur familière, presque rassurante.</p>
          <p>L'adjudant n'avait pas bougé. Assis sur son sac, Soyinka ouvert à la même page, le mégot mort entre l'index et le majeur. Il fixait l'horizon, ce point flou où la savane se dissolvait dans un ciel blanchi de chaleur. Prière ou décompte des morts. Avec lui, ça ne se demandait pas.</p>

          <p>L'adjudant s'approcha, pas lourd, silence entier.</p>

          <p>Une cigarette. Le briquet qui résiste au vent puis cède. La fumée âcre, familière comme une gifle qu'on connaît.</p>
          <div class="dialogue"><p>— L'ordre vient d'en haut, répéta-t-il à mi-voix. Qu'ils aillent se faire foutre.</p></div>
          <p>L'adjudant eut quelque chose qui ressemblait à un sourire. Un rictus de lassitude partagée entre deux hommes qui n'ont plus besoin de se raconter la fatigue. Trois jours de reconnaissance, d'embuscades, de course en brousse. La cible cartographiée, mémorisée, à deux heures de marche. Et maintenant l'attente. Toujours elle, cette maladie sans fièvre.</p>
          <div class="dialogue"><p>— On marche, dit le commandant en écrasant le mégot sous sa botte.</p></div>
          <p>Ils descendirent vers le sud, sur la piste rouge qui saignait hors de la base. Personne ne les arrêta. Ils étaient de ceux qu'on ne questionne pas. Les bottes crissaient, les pas des suivants se posaient dans ceux de devant, sans y penser.</p>
          <p>La chaleur cédait d'un cran. Lumière dorée des fins de jour africaines, ce moment suspendu entre deux mondes. Des oiseaux dans les broussailles. Une bête, au loin, qui rôdait après une proie ou après rien.</p>
          <div class="dialogue">
            <p>— Gao, dit l'adjudant. Après un long silence.</p>
            <p>— Comme si j'y étais.</p>
          </div>
          <p>Rien de plus. Pas besoin. Le mot suffisait à rouvrir la plaie : les corps alignés dans la poussière, les yeux d'enfants figés dans une terreur qui ne se refermerait plus, l'odeur du sang sur la paille brûlée. L'attente, ce jour-là, avait tué plus sûrement qu'une balle. Ils le savaient tous les deux. Ils n'avaient pas besoin de se le dire.</p>
          <p>Trente minutes de marche. La piste s'incurvait vers l'ouest, longeait un puits mort. Des carcasses de véhicules gisaient dans le sable, rouillées, à moitié avalées. Cimetière d'épaves et de convois oubliés.</p>
          <p>Le commandant s'arrêta net. Quelque chose avait changé dans l'air. Une déchirure minuscule dans le silence. Poing levé. L'adjudant se figea comme un roc.</p>
          <p>Ils restèrent immobiles, aux aguets, humant le vent chargé de carburant et de poussière chaude. Puis un grondement, lointain, mécanique.</p>
          <div class="dialogue">

            <p>— Pas les nôtres.</p>
          </div>
          <p>Accroupis derrière un monticule de pierres, jumelles sorties, balayage de l'horizon. Trois pick-up progressaient sur la piste, hommes armés à l'arrière, drapeaux noirs pendus mollement dans l'air brûlant.</p>
          <div class="dialogue"><p>— Putain de merde.</p></div>

          <p>Radio décrochée, voix plate, débit mécanique :</p>
          <div class="dialogue">

          <p>Et dans le crâne du commandant A1C7B23, une seule pensée, froide comme une lame : cette fois, l'ordre venait d'en bas. Et il faudrait le faire respecter.</p>

          <p>Ils atteignirent la base par le ravin. Au moment où le soleil basculait derrière la ligne des collines, embrasant la savane d'un rouge de plaie ouverte. Le commandant grimpa le talus en trois enjambées, l'adjudant sur ses talons. La 403 avait changé de visage. Baraquements vidés de leur vie, tentes aplaties comme des bêtes abattues. Chaque homme fondu dans l'ombre, arme pointée vers la piste. Un silence épais, électrique. Prêt à se déchirer.</p>

          <p>D'abord des ombres mouvantes dans la lumière qui mourait. Trois carcasses trapues bondissant sur les ornières, grappes d'hommes accrochées à l'arrière, cris gutturaux, drapeaux noirs qui claquaient comme des ailes de charognard.</p>
          <p>Le cœur du commandant ralentit. Doigt sur le pontet. À côté, l'adjudant mâchait une herbe sèche, imperturbable. Sur la ligne, un homme murmura un nom de femme. Un autre ferma les yeux, une seconde, pas plus. Puis rien.</p>
          <p>Cent mètres. Un homme descendit du premier véhicule, jumelles collées au visage, scrutant les ruelles entre les baraquements, les tas de sable, les toits de tôle. Le commandant ne respirait plus. Le silence, une chose physique, un étau sur les poumons.</p>

          <div class="dialogue"><p>— Maintenant.</p></div>
          <p>L'enfer murmura un de ses surnoms. Le feu se referma sur eux comme une mâchoire. Les fusils-mitrailleurs crachèrent en jets longs, croisant leurs gerbes. Le premier pick-up se souleva, perforé de bord en bord, éventré. Le conducteur s'effondra sur le klaxon qui hurla seul dans le vacarme. Les hommes à l'arrière tombèrent avant de comprendre d'où venait la mort. Le deuxième véhicule tenta un demi-tour.</p>
          <p>POINT l'attendait. Une détonation sèche, un trou dans la nuque, le chauffeur bascula. Le pick-up s'immobilisa en travers de la piste. Les survivants sautèrent à terre, cherchant refuge derrière les roues, la tôle, les cadavres de leurs frères.</p>
          <div class="dialogue"><p>— Trop exposés, cracha le commandant dans la radio. Section deux, gauche. Section trois, droite. Tenaille.</p></div>

          <p>Le troisième véhicule, resté en retrait, crachait un feu continu depuis une mitrailleuse lourde. Les balles crevaient les tôles, arrachaient des éclats de briques. Le commandant se plaqua derrière un sac de sable, sentit le souffle des impacts qui cherchaient sa chair.</p>

          <p>Une expiration. Un tir. Le tireur ennemi bascula sur son arme, la face emportée. Son canon fumant se tut.</p>

          <p class="epigraph">Je sentis passer une pensée. Elle se pansa d'essence et se dépensa en sens. Et alors que sa coquille vide tombait sur le fond de l'océan de mes pensées, une autre pensée l'engloutit frénétiquement. Elle se pensa alors pansée. Mais un tentacule émergea, tout en ventouses de quêtes, et l'écrasa sur un plancher océanique de luxures. Nuit d'insomnie.</p>
          <p class="refrain">Les calepins d'OZIAS</p>

          <p class="section-heading">Givrés</p>
          <p>Le hublot était embué, du moins c'est l'impression que j'avais. Il avait cet aspect translucide et brumeux qui évoque la moiteur. J'émergeais à peine d'une sieste soudaine. Sur l'écran en face de moi, le film se poursuivait.</p>
          <p>Quelques lourdeurs dans mes muscles m'ont incité à me redresser pour m'étirer. Ma voisine, la passagère d'à côté, était là. Toujours aussi illisible. Calée dans son siège avec son regard lointain. Elle paraissait si distante.</p>
          <p>Je jette un regard par le hublot. L'astre solaire dardait une marre de nuages quelque part au loin. Et l'horizon me paraissait peint sur un quai de métro. Entre lui et moi, des rails, des lignes, des nuages. Le vol était paisible. De mon point de vue en tout cas.</p>
          <p>La voisine venait de bailler. Elle a retiré ses lunettes et se frotte méthodiquement les paupières. Pas brutalement, de façon compulsive et désordonnée comme j'aurais fait. Mais avec douceur et délicatesse. Elle exerçait une infime pression avec son pouce et son index, chaque doigt ayant l'air de caresser avec bienveillance le globe oculaire plutôt que de l'écraser. Cette femme avait une douceur naturelle qui m'intimidait.</p>
          <p>Je jette un nouveau regard par le hublot et j'ai l'impression que les ailes sont couvertes de givre. Givrées ! Comme ces humanoïdes qu'elles convoient. Ces ailes affrontaient le froid du ciel et la vitesse de cet oiseau volant qui avait dans ces flans plusieurs dizaines d'âmes. Des univers miniatures, aussi similaires que différents.</p>
          <p>Le coude de ma voisine vient de heurter le mien. Elle m'adresse un presque sourire en signe d'excuse. Mais pourquoi ses lunettes lui donnent cet air sage ? Et pourquoi elle me fait penser à Mia Khalifa ? Elle n'a pourtant rien d'oriental, en tout cas pas de mon point de vue.</p>
          <p>Elle dégageait une noblesse simple et un parfum vanillé qui m'interpelait. Une inconnue. Je ne connais même pas son nom. Son histoire encore moins. A part un bonjour, nous n'avions échangé qu'un ou deux regards. Elle et moi, n'étions que des trajectoires qui s'effleurent, comme tous ces passagers à bords.</p>
          <p>Tous givrés surement. Et portés par les ailes givrées d'un tube d'aluminium qui viole le ciel, suspendu au-dessus des nuages.</p>
          <p class="a-suivre">A suivre</p>

          <p class="section-heading">Mon miel, ne t'affole pas.</p>
          <p>Au fond je m'en fous que tu me parles ou que tu te taises. Je comprends suffisamment le langage de ton silence pour te savoir à demi-mot, ou à demi silence pour le coup. Ce que tu ne diras pas m'atteindra quand même. Il suffit que tu le vibres. Je suis de cette nature-là et tu le sais. Une corde de violon que le moindre frémissement de tes émotions fait geindre. Une peau de tambour un peu trop tendue qu'il te suffit d'effleurer pour la rompre.</p>
          <p class="refrain">Les calepins d'OZIAS</p>

          <p class="section-heading">Bruno</p>
          <p>Le hall de l'aéroport avait cette atmosphère impersonnelle qui m'égare souvent. Ce son réverbeux et enveloppant, reconnaissable entre mille. Me voilà dehors. Pourquoi ma seule préoccupation est d'allumer une cigarette ?</p>
          <p>Je suis sensé me rendre à mon hôtel, « DOMINATION ». La conférence a lieu demain. Il fait chaud, lourd, moite. Je me sens oppressé. Pourtant Cotonou avait des airs plutôt engageants. La malédiction planait toujours mais un coussin de prémonitions la gardait lointaine. Du moins par endroits.</p>
          <p>Bruno apparait. Il se presse à peine. Arborant un sourire en bandoulière comme une kalashnikov encore chaude. Ce mec est vraiment jaloux de ses kilos. Toujours rond comme s'il était enceint d'un projet séculaire.</p>
          <div class="dialogue"><p>— Alors, l'artiste ? Tu as fait un bon vol ?</p></div>
          <p>Il exhalait un délicieux parfum. Habillé comme un chef d'entreprise dans sa chemise à rayures. Les manches repliées. Le trousseau de clé dans la paume. Je ne suis pas tout à fait comme lui. Je combats des démons.</p>
          <div class="dialogue"><p>— Tranquille. Un vol sans histoire. Mais j'ai faim.</p></div>
          <p>Même pas une poignée de main, juste un check et une main sur l'épaule et on s'était tout dit. Nous avions cette proximité d'âme qui rendait nos silences éloquents. Je n'avais qu'un sac à dos, comme d'habitude.</p>
          <p>Il conduisait avec détachement, la clim à bord m'avait apaisé un minimum. Même mes anges s'étaient détendus.</p>
          <div class="dialogue">
            <p>— On se fait un tchiep ? Ou tu préfères du agbéli comme d'hab ?</p>
            <p>— C'est toi qui commande, je te suis !</p>
            <p>— Ok donc un bon tchiep, une dose adulte. J'ai découvert un nouveau coin, c'est une copine qui m'a amené là-bas. Tu verras, c'est calme et la bouffe est juste dingue.</p>
          </div>
          <p>Place de l'amazone, palais de la marina, port autonome, l'axe est plutôt fluide à cette heure. Quelques miasmes des profondeurs créaient des tourbillons dans mon champ vibratoire. Mais un seigneur faisait régner une quiétude quintessentielle en moi.</p>
          <p class="a-suivre">A suivre</p>

          <p class="section-heading">Thiep</p>
          <p>Thiep rouge avec une tranche de poisson monumentale, comme sortie du vieil homme et la mer. Un jus de gingembre pour escorter ce massacre. Me voilà perché comme dans un désert à la Le Clézio. Ce thiep est déjà un véritable orgasme oculaire, et je salive comme une fille mouille. Un aménagement de couleurs, de formes et de textures. J'en ai la langue en érection.</p>
          <p>Une coupole de riz aux grains athlétiques régnait sur ce plat. Mais pour moi ce riz n'est qu'un prétexte. C'est cette robuste tranche de poisson, accoudée à la bordure de l'assiette, qui domine le spectacle. Protéines disciplinées arrachées aux entrailles de la mer et livrées à mes papilles en chaleur.</p>
          <div class="dialogue"><p>— Mange Ishaq !</p></div>
          <p>Bruno m'a tiré de mes fantasmes. Assaut frontal. Mission radicale. Seuls quelques arrêtes échapperont au déluge de feu. Jus de gingembre dégoupillé comme une grenade, juste à temps pour éteindre une bouchée djihadiste.</p>
          <p>Mon assiette est nette. Comme une plage vide de visiteurs. Bruno sourit. C'est le contraire qui m'aurait surpris. Il sourit comme je fronce les sourcils, comme pour recentrer sa conscience d'exister. Je vous reparlerai de Bruno. Un gars vrai comme pas deux. La loyauté faite homme, la fidélité d'âme par excellence.</p>
          <p>Il avait flingué son plat bien avant moi, et saigner deux flacons de jus de baobab. Il ne rigole pas avec la bouffe. Son profil en atteste. Je ne l'ai jamais vu perdre un gramme. Toujours rond sous toutes les coutures. Jamais trop non plus. Un gros qui se maintient au même poids, qu'il avale un éléphant ou juste quelques arachides.</p>
          <p>Moi ma dépendance à la nicotine venait de me mettre un coup de pression. Il faut que je nuise gravement à ma santé. J'embarque Bruno avec moi vers l'extérieur. La partie jardin. Le soleil régnait en maitre, comme par réflexe nous avions tous les deux arboré nos lunettes de soleil réglementaires.</p>
          <p>Bruno ne fume pas. Il boit peu. Mais il mange, il travaille, il baise et il aime les gens. Ses gens. Alors il sirote une eau en bouteille et moi un soto VIP en fumant une horrible cigarette coréenne. Putain, mon suicide différé dure depuis un sacré bout de temps.</p>
          <p>Les âmes conversent avec les origines et ceux qui portent la marque sont des espions malgré eux, impliqués dans des interactions et des interférences subliminales parfois brutales.</p>
          <p class="a-suivre">A suivre</p>

          <p class="section-heading">Je la connais</p>
          <p>L'hôtel était d'un chic standard. Les volumes du hall, les tons des murs, le professionnalisme du personnel, tout était au standard international. Sauf cette silhouette que j'entrevois de dos.</p>
          <div class="dialogue">
            <p>— La conférence aura lieu dans la salle Béhanzin, me dit Bruno, mon équipier de choc. Kemi Seba est au 3ème étage je crois. Il fera une présentation sur les Forces spéciales des Etats Unis d'Afrique. Nathalie est au même étage, elle va développer le thème de la monnaie unique.</p>
            <p>— Ok. Moi j'ai quelques lignes sur mon thème. Je vais improviser le reste.</p>
            <p>— Improviser ? Tu rigoles, on a échangé sur ton topo depuis 7 semaines. Tu as 20 pages bien dosées !</p>
            <p>— Oui, je sais. Mais je dois m'ajuster au moment.</p>
            <p>— Chambre 106. Je t'ai fait monter deux costumes et des chaussures. Si tu as besoin d'autre chose tu me dis. Sonia bosse ici, tu peux l'appeler si tu as un souci. Moi je dois gérer d'autres détails. Je t'appelle tout à l'heure.</p>
          </div>
          <p>Minutieux comme un artificier, détendu comme un boudha. C'est tout Bruno ça. L'air de ne rien faire d'important, il pilote 50 000 projets à la fois. Tout mon contraire.</p>
          <p>Mais voilà ! La silhouette, c'est la fille de l'avion. Elle me dépasse calmement, les yeux rivés sur son téléphone. Elle fait exprès ou quoi ?</p>
          <p>Ma chambre est vaste, soignée et diablement bien rangée. Les costumes sont affalés sur le lit, avec les chaussures neuves, toujours dans leur boite. J'ouvre la fenêtre. J'ai même un balcon et la plage à portée de vue. Je m'assieds et allume une clope. Elle est horrible. Le vent est tiède et la mer calme.</p>
          <p>Je connais cette fille. Une artiste que j'ai côtoyée. D'assez près d'ailleurs. Il y a des pêcheurs au loin, qui récoltent du poisson à l'ancienne. Au rythme des vagues et du vent. Ce décor mériterait bien une photo pour Instagram, mais je suis assez rare sur ce réseau. Trop loin de mon univers.</p>
          <p>Moi je deale avec des pulsations rétives et des angoisses muettes. Des instants qui n'en finissent pas de passer et des équations insolubles dans une vie normale. Je négocie des imaginaires comme un trader mythomane, pour les revendre à des ouvrages ou des beats. Je pars en éclaireur vers l'horizon, sans certitudes autres que je suis un enfant de la lumière. Un sacrifice vivant.</p>
          <p>Mais j'en suis certain, cette fille, je la connais.</p>
          <p class="a-suivre">A suivre</p>
        `

        title: 'Fragment 2',
        html: `
          <p class="section-heading">Personne</p>
          <p class="poem">Personne ne sait tout<br>Chacun en sait assez.<br>N'écoute pas le doute<br>Ce bourdonnement parasite.<br>Ecoute le silence obséquieux<br>Des enfants de la prophétie,<br>Depuis les arcanes de tes infinités.<br>Puis couvre ce silence,<br>De part en part,<br>Du martyr de tes héros intérieurs.<br>Car nul ne sait tout à fait<br>Et chacun en sait assez.</p>

          <p class="section-heading">On nous a menti</p>
          <p>En ce qui concerne l'Afrique, les Noirs, depuis le début on nous a menti. Souvenez-vous que la fin est dans le commencement. Je sais que l'avidité de la bête est insatiable et qu'elle utilise les esprits méchants pour contraindre nos allégeances. Mais vous avez une autorité ultime qui justifie tout cet acharnement.</p>
          <p>J'entends beaucoup de gens, des sachants de divers horizons, journalistes, économistes, chercheurs, politologues, économistes, sociologues, etc, des gens qui savent ou pensent savoir mille et une choses sur mille et une questions, des gens qui sont ou qui pensent être ceci ou cela, et toutes ces gens parlent de l'Afrique, de fort belle manière d'ailleurs. Comme pour célébrer un crime parfait entre meurtriers innocentés.</p>
          <p>Ils parlent de l'Afrique, se sentant autorisés par leurs visions parcellaires, rassurés par leurs suffisances. Ils se limitent aux reflets qu'ils entrevoient de cette Afrique racine. Depuis leurs meurtrières culturelles ou intellectuelles, ils considèrent savoir ce qu'est l'Afrique et spéculent. Ils voient des matières premières et des millions de consommateurs. Et ils ont raison de penser ainsi.</p>
          <p>Mais le verbe des anciens et la foi des aïeux rendent l'esprit invincible. La Croix du Christ, comme le Coran de Mahomet se sentent chez eux ici. La toile d'araignée des énergies fondamentales a quelques élus en ces terres. Leur insignifiance apparente est leur meilleur bouclier.</p>
          <p>Ces ainés gardent tendus des filins mémoriels et vibratoires pour que continue de se répandre le son des origines. Le bruit de l'intention originelle dont le murmure parle aux fils. Ces enfants qui portent la marque des descendants de la lumière. Ils en savent suffisamment pour en dire peu. Ces enfants-là connaissent le poids de leur charge.</p>
          <p>Bref. Bien des gens parlent de l'Afrique mais il y a une chose quintessentielle à garder à l'esprit. Tout ce monde parle de l'Afrique, mais en définitive il n'y a que nous qui savons. Parce qu'ils parlent de l'Afrique, mais nous, nous sommes l'Afrique !</p>
          <p class="a-suivre">A suivre</p>

          <p class="section-heading">Réseaux sociaux</p>
          <p class="poem">De la matière pour nos vides<br>Des pixels qui se pensent<br>De la jactance puérile<br>Du voyeurisme addictif.<br>De l'érotomanie compulsive<br>Des jaillissements inspirés<br>De l'exhibitionnisme primaire<br>Des vies numériques fantasmées.<br>Des vanités enfantines<br>De la contradiction mécanique<br>De l'humour au sens premier<br>De la connexion d'humanitudes.<br>De la soif d'en être<br>Du besoin de reconnaissance<br>De la peur de manquer<br>De l'étalage de solitudes.<br>Des puits de science sans fond<br>Des aspirateurs à onlyfans<br>De la dopamine en gigabits<br>De l'addiction conçue en labo.<br>Tout et rien<br>Ce sont les réseaux sociaux.<br>Et j'en reprendrai bien quelques clics.</p>

          <p class="section-heading">Mon speech</p>
          <p>Je dois parler de l'art comme levier d'une Afrique noire au cœur du monde. Un défi. Comment dire l'évidence. Comment formuler l'élémentaire. A l'œil nu tu peux le voir ça. Que l'Afrique est art, au sens premier du mot. Un art encore exempt de la réflexion prétentieuse qui veut tout justifier.</p>
          <p>Mais bon. Comme un astéroïde tombé des noirceurs du cosmos, l'occident nous a percuté de plein fouet. Exportant ses victoires et son orgueil, ses fragilités et ses abîmes, jusqu'aux portes de nos consciences.</p>
          <p>Parce qu'elle parle, pense et vit dans des langues d'emprunt, cette Afrique est un cas psychiatrique. Schizophrène ou bipolaire ? Je n'en sais rien.</p>
          <p>Ne pouvant formuler son essence que dans ses propres langages, notre Afrique a emprunté une hypocrisie salvatrice au monde dominant. Elle est amputée, mais sent toujours les démangeaisons de ses membres fantômes. La prothèse est mignonne mais quelque chose de racine cherche un chemin pour se dire.</p>
          <p>Ces hordes d'humanitudes éclopées ne peuvent pas se renier. Alors elles font semblant de croire au script d'un monde qui dit avoir un idéal autre que l'Homme. Taux de croissance, progrès technologique, intelligence artificielle, 5G ou Meta, multinationales, profits financiers, milliardaires désaxés, et puis quoi ?</p>
          <p>Solitude et impuissance terminale à la Steve Jobs ?</p>
          <p>Il y a à coup sûr un bug dans cette matrice. Mais des esprits fondés pour croire au mythe de la croissance ''toutes choses égales par ailleurs'' ne peuvent pas y remédier. Ils se renieraient. Et l'être humain ne se renie pas ! A moins que ...</p>
          <p>Depuis le choc colonial, la poussière n'est pas encore retombée. Elle entretient des angles morts dans l'imaginaire et dans les propos d'esprits pourtant supposés éclairés. Cette poussière de corps vaporisés et de semences pirates, s'est mêlée à des pulsions fondamentales.</p>
          <p>Résultat, on justifie l'injustifiable. Des tumeurs sont nées sur les blessures des survivants et une mémoire sans âge rumine l'offense.</p>
          <p class="a-suivre">A suivre</p>

          <p class="section-heading">Du venin de nymphe</p>
          <p>Connaissez-vous le quatre quarts ? Ce gâteau monolithique qui torpille les papilles à coups de mortier. ¼ de beurre, ¼ de sucre, ¼ d'œuf et ¼ de farine. Mais arrêtez de saliver.</p>
          <p>J'ai découvert un drôle de 4/4 l'autre jour dans un kiosque sénégalais au Québec. Tenu par un normand, l'endroit était approvisionné par des chinois. Ce 4/4 là ne se mange pas. Il s'inhale.</p>
          <p>Il est fait d'un quart de certitudes, d'un quart de doutes, d'un quart de dominations et d'un quart de cynismes. On y décèle pêlemêle des traces de Congo et d'Algérie, des molécules de Texas et d'Inde, des fragments d'Argentine et de Russie, et même un arôme de Casamance avec un arrière-gout de Tombouctou.</p>
          <p>Ce quatre quarts là répand des effluves de nitroglycérine et des relents aigres de dollars moisis. Il colporte un narratif éculé, fait d'amnésie et d'une religiosité infectée. Son promoteur principal a plus une tête de Donald Trump sous Fentanyl qu'un faciès à la Zemmour.</p>
          <p>Ce produit magique, ce venin de nymphes, s'inhale dans d'élégantes capsules de titane, étanches et stériles. Déclinés en sept couleurs selon le dosage, les étuis arborent des images de nymphes pixellisées. Elles ont beau être belles, les entrailles de ces nymphes ainsi que leurs utérus proéminents pendouillent à leur suite. Reliés au rectum ou à la vulve par de minces filets de chair.</p>
          <p>Il en existe déjà des contrefaçons baptisées Oraison, qu'on peut se procurer sur le darkweb. Cette version frelatée sort des faubourgs du Pakistan et ses effets secondaires sont innommables. La CIA en a déjà retrouvé dans des clubs de Lagos, de Tokyo, et de Berlin.</p>

          <p class="section-heading">L'ardence</p>
          <p class="poem">Tout finit par passer,<br>Le temps comme les gens,<br>Le désir comme le ravissement.<br>Seule subsiste l'idée,<br>L'intention,<br>La raison des choses.<br>Et ce sont elles qui,<br>Comme une persistance rétinienne,<br>Entretiennent l'ardence de nos quêtes.</p>

          <p class="section-heading">Brutal</p>
          <p class="poem">Par essence,<br>Exister est brutal.<br>Nous venons d'une lave fondue<br>Qui a agrégé de la matière<br>Et vaporisé des eaux troubles.<br>Cette violence fertile est l'œuf du monde<br>Qui annonce des coquilles craquelées<br>Et des vagins distendus pour laisser crier une vie.<br>La vie se nourrit de vie<br>Et s'en empare avec une saine brutalité.<br>Tu tues et manges<br>Pour qu'on te tue et te mange à ton tour<br>D'une manière ou d'une autre.<br>Brutal.</p>
