          <p class="section-heading">L'aube des nerfs</p>
          <p>Le jour s'est levé sur Cotonou comme un couvercle qu'on arrache d'une marmite en ébullition. La chaleur montait en volutes épaisses depuis le bitume, et les klaxons des zems tissaient une toile sonore réticulée, tendue et vibrante, à travers la ville encore engourdie. J'étais au balcon, torse nu, cigarette aux lèvres, offert à la moiteur comme un sacrifice tiède. La fumée dansait dans l'air lourd, paresseuse, comme si elle cherchait à échapper à sa propre existence.</p>
          <p>J'avais mal dormi. Ou plutôt, j'avais dormi avec des rêves qui n'étaient pas les miens. Des rêves de poussière et de sel, des rêves où des voix sans visage me parlaient dans une langue que je comprenais sans la connaître. Au réveil, ce goût de fer dans la bouche, âcre et persistant, ce goût des nuits où l'âme voyage trop loin du corps et revient les mains vides. Des crampes au cerveau, comme si mes pensées avaient couru un marathon sans moi et sans médaille. Des courbatures à l'âme, de ces douleurs diffuses qui ne se localisent pas mais qui pèsent, qui tirent, qui rappellent que vivre est un effort de chaque instant.</p>
          <p>La mer, en contrebas, respirait doucement, immense poumon d'écume. Des vagues paresseuses léchaient le sable doré, laissant des traces d'écume qui brillaient sous le soleil comme des veines d'argent incrustées dans la peau du rivage. Des pêcheurs s'affairaient au loin, gestes lents et précis, hérités d'un temps où l'homme et l'océan conversaient d'égal à égal, sans intermédiaire, sans commission, sans courtier.</p>
          <p>Je pensais à mon père. À sa vie. À ses mains de paysans. A sa voix, rythmée comme un tambour lointain. Je pensais aux ancêtres. Ils sont toujours là, quelque part entre deux sommeils, entre deux mondes. Vivants. Présents. Sur les autels comme sur les tapis de prière. Ils nous portent, transmettent et confient. Espèrent pour nous et par nous. Ils parlent sans mots, disent sans formuler, et pourtant on les entend, si l'on veut bien se taire.</p>
          <p>La transmission entre générations, c'est une drôle de chose, une mécanique fragile et têtue. On croit recevoir un héritage, et on découvre qu'on a reçu un fardeau. On croit continuer une œuvre, et on se rend compte qu'on l'a trahie. Mais souvent les devanciers avaient déjà trahi. Sans le vouloir, ou en se voilant la face. L'artisan des mots que je suis doute trop, cherche de l'or dans la rivière des origines en interrogeant des ombres muettes. Comme ses devanciers. Il trahira aussi peut-être. Un peu moins, j'espère. Un peu mieux, je le voudrais.</p>
          <p>La clope se mourait entre mes doigts et je regardais sa braise rougir puis pâlir dans la pénombre naissante. Des mini clignements rougeâtres qui semblaient faire des clins d'œil complices, dernières confidences avant l'extinction. Mes anges s'agitaient doucement, comme des enfants qu'on réveille trop tôt et qui rechignent à quitter le songe.</p>
          <p>Bruno m'avait laissé un message pendant la nuit : « Réveil à 7h. Petit-déj au restaurant. On a du pain sur la planche. » Je n'avais pas répondu. Bruno comprenait. Bruno savait mes silences fidèles.</p>
          <p class="a-suivre">À suivre</p>

          <p class="section-heading">Entropie</p>
          <p>Il y a des jours où tout se délite, où tout craque de l'intérieur sans bruit. Où les certitudes se fissurent, où les liens se distendent, où les sens se brouillent comme une image mal réglée. C'est l'entropie, cette loi silencieuse et implacable qui veut que tout système tende vers le désordre, que toute énergie se dissipe, que toute structure finisse, tôt ou tard, par s'effondrer sous son propre poids.</p>
          <p>Je la sens partout, cette entropie, rampante et patiente. Dans les corps qui vieillissent, dans les couples qui se défont pierre par pierre, dans les empires qui s'écroulent dans un fracas qu'on feint de ne pas entendre. Elle est à l'œuvre dans l'Afrique que je regarde, cette Afrique tiraillée entre ses rêves et ses réalités, entre ses racines et ses prothèses importées, entre ses peuples et ces élites qui ont troqué la terre natale contre des salons climatisés et des passeports de complaisance.</p>
          <p>Mais l'entropie n'est pas qu'une force de destruction. Elle est aussi une force de transformation, une matrice cruelle mais féconde. Elle défait pour refaire, elle décompose pour recomposer. Et c'est peut-être cela que je vois en ce moment : une Afrique qui se défait pour se refaire, qui meurt pour renaître, qui se décompose pour se recomposer — pendant que certains, tout en haut, regardent le chaos depuis leurs terrasses privées, convaincus d'y échapper.</p>
          <p>Je pense à tous ces jeunes qui rêvent d'ailleurs, poussés par le désespoir et l'espoir mêlés, embarqués sur des pirogues qui sont autant de promesses que de tombes. Je pense à ces afrodescendants qui reviennent sur la terre de leurs ancêtres, cherchant dans le sol, dans la langue, dans les rituels, une part d'eux-mêmes qu'on leur a volée. Je pense à ces diasporas qui oscillent entre deux mondes, deux identités, deux mémoires en perpétuel négociation. Et je pense, avec une colère froide, à ces élites locales qui n'oscillent, elles, jamais : fixées à Genève, à Paris, à Dubaï, elles envoient leurs enfants étudier loin des écoles qu'elles laissent s'effondrer, et reviennent chez elles seulement pour couper des rubans.</p>
          <p>Et je me dis que l'entropie, c'est cela aussi : ce mouvement perpétuel qui brasse les peuples, les cultures, les histoires — et qui, un jour peut-être, emportera avec lui les tours d'ivoire climatisées où se calfeutre une caste hors-sol. Ce chaos fertile d'où naissent les mondes nouveaux, malgré ceux qui préféreraient l'ancien monde, tant qu'il les nourrit.</p>
          <p class="refrain">Ces jeunesses africaines fleuriront, fût-ce sur leurs tombes.</p>
          <p class="a-suivre">À suivre</p>

          <p class="section-heading">Miasmes</p>
          <p>Des miasmes s'élèvent de la ville, âcres et tenaces. Pas seulement ceux des caniveaux à ciel ouvert, des marchés surchargés, des décharges sauvages qui fument sous le soleil. Non. Des miasmes plus subtils, plus insidieux, plus difficiles à nommer. Des miasmes d'âmes, des miasmes d'histoires, des miasmes de mémoires mal digérées.</p>
          <p>Je les sens monter depuis les profondeurs, ces vapeurs toxiques qui empoisonnent les esprits et les cœurs sans qu'on puisse les voir venir. Elles viennent de loin, de très loin. Elles viennent des cales des navires négriers, des chaînes de l'esclavage, des fouets de la colonisation. Elles viennent des guerres, des famines, des trahisons répétées. Elles viennent de tout ce que l'Afrique a subi et porté, silencieusement, sur son dos courbé.</p>
          <p>Mais il y a aussi des miasmes nouveaux, plus feutrés, produits en costume-cravate. Ceux que produisent les crises du monde, les guerres lointaines, les appétits insatiables des puissances. Je pense à l'Ukraine, à l'Iran, à tous ces conflits qui font la une des journaux pendant que l'Afrique conspire en silence dans l'antichambre de l'Histoire. Je pense à ces compagnies qui engrangent des profits colossaux pendant que des gens meurent, pendant que des bombes calcinent des vies — et je pense à ces élites africaines qui signent, applaudissent et cosignent, dans des salons feutrés, des accords qu'elles ne liront jamais en entier, contre des commissions qu'elles ne déclareront jamais.</p>
          <p>On nous dit que c'est la géopolitique, que c'est l'économie, que c'est la marche du monde. Mais moi, je vois autre chose. Je vois des miasmes qui s'élèvent depuis les salles de conseil d'administration, depuis les cabinets ministériels d'Abidjan à Nairobi, depuis les studios de télévision où l'on répète des éléments de langage venus d'ailleurs. Des miasmes de cynisme, d'indifférence, de cupidité — et une caste entière, chez nous, qui a fait de la déconnexion un art de vivre, qui parle du peuple à la troisième personne, depuis des bureaux où l'air conditionné couvre le bruit de la rue.</p>
          <p>Et je me dis que l'Afrique nouvelle, celle qui éclot en ce moment, devra apprendre à respirer malgré ces miasmes. À trouver son oxygène dans un monde toxique, y compris quand la toxicité vient de son propre sommet. À créer des oasis dans ce désert de violence et d'injustice, même quand ceux qui devraient creuser les puits préfèrent importer l'eau en bouteille.</p>
          <p class="a-suivre">À suivre</p>

          <p class="section-heading">La nouvelle Afrique</p>
          <p>Elle éclot, je vous le dis, envers et contre tout. Elle éclot dans la douleur et dans l'espoir, dans la fureur et dans la tendresse. Elle n'a pas de visage unique, pas de voix unique, pas de chemin unique. Elle est multiple, diverse, contradictoire, indomptable.</p>
          <p>Elle est dans ces start-ups qui fleurissent à Lagos, à Nairobi, à Dakar, portées par des jeunes qui n'ont hérité de rien sinon de leur audace. Dans ces artistes qui inventent des langages nouveaux, mêlant les rythmes ancestraux aux sonorités électroniques. Dans ces femmes qui prennent la parole, qui prennent le pouvoir, qui prennent leur destin en main sans attendre qu'on le leur cède.</p>
          <p>Elle est aussi dans les quartiers populaires, dans les villages reculés, dans les camps de réfugiés. Dans ces vies ordinaires qui résistent, qui s'adaptent, qui espèrent malgré tout, malgré l'absence de routes, d'hôpitaux, d'écoles dignes de ce nom. Dans ces mères qui se lèvent avant l'aube pour nourrir leurs enfants avec ce qu'il reste. Dans ces pères qui se saignent pour offrir un avenir à leur descendance, pendant que d'autres, en haut, se gavent sans jamais se rassasier.</p>
          <p>La nouvelle Afrique, c'est tout cela. Ce n'est pas un projet politique, ce n'est pas une idéologie, ce n'est pas un slogan qu'on brandit en meeting. C'est une réalité vivante, organique, en perpétuelle transformation, qui grandit souvent malgré ses dirigeants plutôt que grâce à eux. C'est un continent qui se réinvente sans cesse, qui puise dans ses racines pour mieux se projeter dans l'avenir — pendant qu'une élite déconnectée continue de regarder vers l'ancien monde comme on regarde une vitrine, nostalgique d'un maître qui ne veut même plus d'elle.</p>
          <p>Et puis il y a les afrodescendants. Ces frères et sœurs de la diaspora qui reviennent, qui questionnent, qui cherchent, souvent avec plus de sincérité que certains fils du pays restés sur place mais partis ailleurs dans leur tête. Ils portent en eux la mémoire de l'arrachement, la blessure de la dispersion, le désir ardent de la réparation. Ils ne sont pas toujours compris, pas toujours acceptés. Mais ils sont là, présents, insistants, et ils transforment le paysage envers et contre les gardiens frileux d'un ordre ancien.</p>
          <p>La colonialité a semé ses outrages mais « Le fleuve n'oublie jamais la source. » Les afrodescendants, ce sont des affluents qui reviennent à la source. Avec leurs eaux mêlées, leurs sédiments étrangers, leurs courants nouveaux. Et c'est cette rencontre qui rend le fleuve plus large, plus profond, plus puissant — assez puissant, peut-être, pour emporter un jour les digues artificielles que dressent ceux qui vivent du cloisonnement des peuples.</p>
          <p class="a-suivre">À suivre</p>

          <p class="section-heading">Crampes au cerveau</p>
          <p>La journée s'annonce dense, écrasante. Bruno m'attend au restaurant, avec son sourire en bandoulière et son énergie de tous les diables. Je descends, le pas lourd, l'esprit embrumé. Des crampes au cerveau, encore. Ces contractions douloureuses qui me prennent quand trop de pensées se bousculent, quand trop de questions se posent, quand trop de réponses se dérobent au dernier moment.</p>
          <p>Je pense à ce que je vais dire à la conférence. Parler de l'art comme levier d'une Afrique noire au cœur du monde. Vaste programme, presque vertigineux. Comment dire l'évidence sans tomber dans le lieu commun ? Comment formuler l'élémentaire sans paraître naïf devant une salle qui a déjà tout entendu, y compris les mêmes promesses recyclées par les mêmes visages ?</p>
          <p>Bruno m'a dit que la salle serait pleine. Des intellectuels, des entrepreneurs, des artistes. Des gens qui croient à l'Afrique, qui travaillent pour elle, qui investissent en elle avec leurs mains et leur sueur. Des gens qui ne veulent plus entendre les discours misérabilistes, ni les éloges creux d'une élite qui confond représenter un peuple et le regarder de haut, mais des paroles de construction, de création, d'avenir.</p>
          <p>Mais il y a aussi ces arrivistes, opportunistes aux dents longues, ces courtisans de tous les régimes qui peuplent chaque estrade officielle. Translucides et sans foi. Ils n'ont pas d'opinion, pas de camp, pas de face. Quel que soit le système qui s'installera, ils chercheront juste à faire leur trou, à négocier leur place au buffet. C'est une nature, une seconde peau. Ce sont des traîtres par essence, rompus à l'art de retomber sur leurs pieds cirés. Leur faim et leurs ambitions en font des alliés objectifs de l'ennemi, quel que soit le nom qu'on lui donne ce jour-là.</p>
          <p>Je croise mon reflet dans la vitre du restaurant. Cheveux hirsutes et barbe grisonnante. Un homme fatigué, mais debout. Un homme qui doute, mais qui avance. Un homme qui ne correspond pas tout à fait à l'image qu'on se fait d'un conférencier, encore moins à celle qu'affectionnent nos élites, tirées à quatre épingles et vides de tout vertige. Mais je suis ce que je suis, et je n'ai rien d'autre à offrir que cela.</p>
          <p>Bruno me fait signe depuis une table près de la fenêtre. Il a déjà commandé du café, des fruits, du pain. « Tu as une tête de déterré, me dit-il. Pas trop dormi ? »</p>
          <p>Je hausse les épaules. « Des clignements dans la nuit. Des pensées qui refusaient de s'éteindre. »</p>
          <p>Il sourit. « Normal. C'est le jour J. Tu vas assurer. »</p>
          <p>Je voudrais le croire. Je voudrais avoir sa confiance tranquille, sa sérénité de roc. Mais je suis un homme de brumes et de braises, un homme de doutes et d'élans. Et c'est avec cela, et rien d'autre, que je dois composer.</p>
          <p class="a-suivre">À suivre</p>

          <p class="section-heading">La chambre 106</p>
          <p>Je suis remonté dans la chambre pour me préparer. Les costumes étalés sur le lit semblaient m'attendre, impeccables dans leur silence, presque menaçants de perfection. J'ai choisi le noir, comme un clin d'œil aux ombres qui m'accompagnent depuis toujours. Le tissu glissait sur ma peau avec une fraîcheur rassurante, une armure de circonstance.</p>
          <p>Par la fenêtre, la mer déroulait son éternelle partition, indifférente aux conférences et aux discours. Le vent s'était levé, portant des odeurs de sel et de poisson, des odeurs de vie et de mort mêlées. J'ai fermé les yeux et j'ai respiré lentement, cherchant à calmer les crampes qui me tordaient le crâne comme un linge qu'on essore.</p>
          <p>Mon téléphone a vibré. Un message de Bruno : « On t'attend. La salle est pleine. » Pas de « bonne chance ». Bruno trouvait que ça portait malheur. Il préférait les actes aux paroles, les présences aux discours — tout le contraire de ces figures publiques qui multiplient les vœux et les promesses sans jamais s'engager le corps.</p>
          <p>Je me suis assis sur le bord du lit et j'ai pensé à mon père. À ce qu'il aurait dit en me voyant là, costume sombre, cœur battant, prêt à parler devant une salle pleine. Il aurait souri, je crois. De ce sourire tranquille qu'il avait quand il était fier sans vouloir le montrer. Il aurait sûrement posé sa main calleuse sur mon épaule et aurait dit : « Vas-y. »</p>
          <p>Et moi, j'aurais eu peur de le décevoir. Peur de trahir ses rêves, de ne pas être à la hauteur de ses espérances. Mais je serais allé quand même. Parce que c'est un devoir, une mission : porter des rêves et des attentes tout en cherchant sa propre voie, loin des ambitions étriquées de ceux qui ne rêvent plus que pour eux-mêmes. C'est accepter la trahison comme une étape nécessaire, comme un passage obligé vers soi-même.</p>
          <p class="a-suivre">À suivre</p>

          <p class="section-heading">La salle Béhanzin</p>
          <p>La salle était pleine, dense, électrique. Des visages graves, attentifs, curieux. Des hommes et des femmes venus des quatre coins du continent, et même d'ailleurs. Des intellectuels, des militants, des artistes, des entrepreneurs. Tous réunis par une même question, obsédante : comment faire de l'Afrique une force créatrice au cœur du monde, quand une partie de ses dirigeants ne rêve que de s'en extraire ?</p>
          <p>Bruno m'attendait près de l'estrade. Il discutait avec Nathalie, l'économiste qui devait parler de la monnaie unique. En me voyant arriver, ils se sont tus et m'ont regardé.</p>
          <p>« Prêt ? » a demandé Bruno.</p>
          <p>J'ai hoché la tête. Je n'étais pas prêt. Je ne le serais jamais. Mais j'étais là, c'était déjà l'essentiel.</p>
          <p>Je suis monté sur l'estrade. Le silence s'est fait, lourd, dense, presque palpable, comme avant l'orage. J'ai regardé l'assemblée. Des yeux, des visages, des attentes suspendues. Et j'ai commencé à parler, sans notes, sans filet.</p>
          <p class="speech">« L'art n'est pas un luxe. L'art n'est pas un divertissement. L'art est la respiration de l'âme. Et l'Afrique est une âme qui respire depuis des millénaires, même quand on a essayé de l'étouffer, même quand certains des siens ont prêté main-forte à l'étouffement... »</p>
          <p>Les mots coulaient comme un fleuve en crue. Je parlais de l'art comme résistance, comme mémoire, comme prophétie. Je parlais de l'Afrique comme matrice, comme source, comme avenir. Je parlais de la nécessité de créer, non pas pour plaire, non pas pour rassurer une élite en quête de vitrine culturelle, mais pour être.</p>
          <p class="speech">« L'art comme munition sur un théâtre de guerre. Guerre des récits et des imaginaires. Guerre des mémoires et des vitalités. L'Afrique, illusion fertile s'il en est, doit combattre un fascisme dopé à la médiocrité de ses partisans. L'Afrique doit s'évader des griffes de milliardaires qui gavent une extrême droite à ses ordres, et de celles, tout aussi serrées, d'une bourgeoisie locale qui leur sert de porte-bagages. Ces milliardaires, d'ici ou d'ailleurs, ne vous diront jamais que toutes ces richesses sont nôtres. Et leurs relais, costumés en patriotes le jour d'une conférence, ne vous le diront pas non plus... »</p>
          <p>Je parlais de la nouvelle Afrique qui éclot, de ces afrodescendants qui reviennent, de ces diasporas qui se reconnectent. Je parlais de l'entropie créatrice, de ce chaos fertile d'où naissent les mondes nouveaux. Je parlais des miasmes qui empoisonnent — ceux du dehors, et ceux, plus intimes, plus honteux, sécrétés par des élites qui ont désappris le nom de leur propre peuple — mais aussi de l'air pur qu'on peut trouver malgré tout.</p>
          <p>Et je sentais que les mots touchaient, que les regards s'illuminaient, que les cœurs s'ouvraient. Mais derrière le voile, la bête guettait. Les rétines injectées d'une colère sans objet, ou peut-être, déjà, avec un objet trop précis pour être dit tout haut.</p>
          <p class="a-suivre">À suivre</p>

          <p class="section-heading">La méridienne des solitaires</p>
          <p>Le soir est tombé sur ma ville comme un rideau de velours bleu, épais et définitif. Toujours au balcon, cigarette de contrebande aux lèvres, orbites égarées dans la pénombre. La mer murmure quelque chose que je n'arrive pas à comprendre, une langue ancienne, une langue d'avant les mots et d'avant les traîtrises.</p>
          <p>La conférence est terminée. Les discours sont prononcés. Les applaudissements se sont éteints. Les entrailles du réel se sont refermées, comme toujours, sur leurs secrets. Je suis face à mes nuits, crampes au cerveau et courbatures à l'âme, seul juge de ce que j'ai dit et de ce que j'ai tu.</p>
          <p>Je pense à mon père. À ma mère. La transmission n'est pas une reproduction, c'est une réinvention constante, exigeante. Elle emprunte des voies étranges. Variations sur un même thème, jamais identiques. L'ennemi aussi se duplique, avec la même obstination. Par scissiparité, par intéressement, par sauvagerie héritée, par prédestination — et parfois par simple confort, quand trahir son peuple rapporte plus que le servir. Il va falloir se battre, encore et toujours, sur tous les fronts, y compris celui-là.</p>
          <p>Je pense à tous ces jeunes qui, comme moi à leur âge, portent le poids des rêves de leurs aînés. À tous ces fils qui trahissent, non par ingratitude, mais par nécessité. Parce qu'on ne peut pas vivre la vie d'un autre. À ces filles qui accoucheront de métis, ponts vivants entre les mondes. La transmission, au final, ce n'est pas léguer des réponses, mais des questions bien formulées et une révolte saine. Ce n'est pas communiquer des certitudes, mais des inquiétudes légitimes. Ce n'est pas transmettre un chemin tout tracé, mais le goût de la marche, même quand ceux qui devraient éclairer la route ont préféré s'en détourner.</p>
          <p>Mes gens, ceux du sang et ceux de l'esprit, m'ont transmis cela. Le goût de la marche, du questionnement, de la quête. Et c'est en marchant notre propre chemin que nous leur faisons honneur. Pas toujours en suivant des traces, mais en en creusant de nouvelles, loin des sentiers balisés par ceux qui ont fait sécession avec leur propre continent sans jamais quitter leurs fauteuils.</p>
          <p>Mégots froids dorment. Vent tiède colporte de vaines menaces. L'esprit a déjà vaincu. C'est cela, le courage de l'espoir. Certitude racine au cœur des ténèbres.</p>
          <p class="refrain">Ces jeunesses africaines fleuriront, fût-ce sur leurs tombes.</p>
          <p class="a-suivre">À suivre.</p>
        `
      }
    ]
  }
];

function renderHome(){
  let list;
  if(works.length === 0){
    list = `<p class="empty-note">Rien n'a encore été déposé ici.</p>`;
  } else {
    list = works.map(w => `
      <div class="entry">
        <span class="stamp">${w.genre}</span>
        <a class="entry-title" href="#/lire/${w.id}/0">${w.title}</a>
        <p class="entry-meta">${w.chapters.length} ${(w.chapterLabel || 'Chapitre').toLowerCase()}${w.chapters.length > 1 ? 's' : ''}</p>
        <p class="entry-excerpt">${w.excerpt}</p>
      </div>
    `).join('');
  }

  app.innerHTML = `
    ${renderHeader()}
    <hr class="rule">
    ${list}
  `;
}

function renderReading(workId, chapterIndex){
  const work = works.find(w => w.id === workId);
  if(!work){ renderHome(); return; }

  const idx = Math.min(Math.max(chapterIndex, 0), work.chapters.length - 1);
  const chapter = work.chapters[idx];
  const label = work.chapterLabel || 'Chapitre';

  const tabs = work.chapters.length > 1 ? `
    <div class="tabs">
      ${work.chapters.map((c, i) => `
        <button class="tab ${i === idx ? 'active' : ''}" data-idx="${i}">${label} ${i + 1}</button>
      `).join('')}
    </div>
  ` : '';

  // A chapter title like "Chapitre 1 — Sous-titre" shows only the part after
  // the dash (the tab already carries the "Chapitre N" part). A plain title
  // with no dash (e.g. "Fragment 1") isn't repeated at all.
  const titleParts = chapter.title.split(' — ');
  const subtitle = titleParts.length > 1 ? titleParts[1] : null;

  const prevWord = label.toLowerCase();
  const prev = idx > 0 ? `<a href="#/lire/${work.id}/${idx - 1}">← ${prevWord} précédent</a>` : `<span></span>`;
  const next = idx < work.chapters.length - 1 ? `<a href="#/lire/${work.id}/${idx + 1}">${prevWord} suivant →</a>` : `<span></span>`;

  app.innerHTML = `
    ${renderHeader()}
    <a class="back-link" href="#/">← retour aux textes</a>
    <span class="stamp">${work.genre}</span>
    <h1 class="work-title">${work.title}</h1>
    ${work.tag ? `<p class="tag-line">${work.tag}</p>` : ''}
    ${tabs}
    ${subtitle ? `<p class="chapter-title">${subtitle}</p>` : ''}
    <div class="chapter-body">${chapter.html}</div>
    <div class="chapter-nav">
      ${prev}
      <span class="spacer"></span>
      ${next}
    </div>
  `;

  app.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      location.hash = `#/lire/${work.id}/${btn.dataset.idx}`;
    });
  });
}

function route(){
  const hash = location.hash;
  const match = hash.match(/^#\/lire\/([^/]+)\/(\d+)/);
  if(match){
    renderReading(decodeURIComponent(match[1]), parseInt(match[2], 10));
  } else {
    renderHome();
  }
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
